# manifest.yaml - one row per file. Seeded from "Servers List with Configuration - BOD_Files GreekSoft".
#
# Date tokens in name/url/member:  {T:%d%m%Y} = BOD date, {P:%Y%m%d} = previous trading day,
#   {D:...} = the candidate date being tried (url_dates for the url, member_dates for name/member).
#
# type:
#   http     direct file URL (no login)
#   zip      download a zip, pull the dated member out of it (stale zips are rejected)
#            member: name inside the zip when it differs from the name we save under.
#            member_dates: [T, P] -> try the member dated T, then P (saved under the name for that date).
# BSE and NSE name contract/participant/scrip masters after the EVENING they are made (P) although the
# content is for T (checked 27-Oct-2026: BSE_EQD_CONTRACT_26102026 holds contracts starting 27-Oct).
# Those rows take exactly the P-named file and save it under the T name UAT uses. Exactly P, never
# "T or P": an evening run would otherwise grab tonight's file, which is for the NEXT day.
#   session  needs the human-logged-in browser; `url` is blank until you record it (bodfetch.py record)
#   servu    file on a Serv-U portal (MCX): `portal`, `dir`; name may contain * ; HTTP login from .env
#            min_modified: T -> for undated names, only a copy modified on/after the BOD date
#   bsegrid  BSE member site's public file grid (no login): `dir` = folder names, `member` = file
#   manual   source not known yet (reported, never silently skipped)
# optional: true   -> a 404 is fine (e.g. fo_secban.csv, sheet says "Not Found")
# grp is only for `--only` filtering.

settings:
  staging_dir: downloads        # relative to this file -> bod-fetch/downloads/<YYYY-MM-DD>/
  holidays_file: holidays.txt
  cutoff: "15:30"            # runs after this time target the NEXT trading day
  session:
    login_urls:                             # one tab each; the human logs in to all of them
      - "https://www.nseindia.com"          # TODO: the NSE member/extranet login page you use
      # - "<MCX member portal login>"       # TODO: for the mcx rows
    probe_url: ""                           # TODO: any URL that only works when logged in (detects expiry)
    login_marker: "login"                   # if the probe lands on a URL containing this, we are logged out
    profile_dir: browser-profile          # login browser's cookies live here (git-ignored, never share it)
    cdp_port: 9222                        # `bodfetch.py browser` listens here (127.0.0.1 only); fetch/record attach
    use_saved_profile: false                # true = try cookies saved in the profile without --login
    portals:                                # `bodfetch.py login <name>`: auto-login, values come from .env
      mcx:                                  # MCX member file server (Serv-U); ID + password only, no CAPTCHA/OTP
        login_url: "https://sftp.mcxindia.com/"   # plain HTTP login + List/Download API, no browser
        user_env: MCX_USER                  # ID and password come from .env
        pass_env: MCX_PASSWORD

